<!doctype html>
<!-- hyperlens HTML 合成模板（原创）。约定：一切画面 = f(t)，由 window.__seek(t) 驱动。
     渲染：python3 scripts/html_render.py assets/comp.template.html --out out.mp4
     预览：浏览器打开本文件，地址后加 ?play 循环播放，或 ?t=1.5 定格。 -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  :root { --ground:#F2EDE4; --ink:#1E1B18; --accent:#D9462B; }   /* 色板锁：全片只用这三个色 */
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ground); }
  #stage { position:absolute; inset:0; overflow:hidden; }
  #world { position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:0 0; }
  .title { position:absolute; font:900 120px/1.1 "Noto Sans CJK SC","Noto Sans SC",sans-serif; color:var(--ink); white-space:nowrap; }
  #dot { position:absolute; width:80px; height:80px; border-radius:50%; background:var(--accent); }
  #line { position:absolute; height:12px; background:var(--ink); transform-origin:0 50%; }
</style></head>
<body><div id="stage"><div id="world">
  <div id="line"></div><div id="dot"></div>
  <div class="title" id="t1">一个点</div>
  <div class="title" id="t2">长成一条线</div>
</div></div>
<script>
const W = innerWidth, H = innerHeight;
window.__meta = { duration: 3, width: 1920, height: 1080, fps: 30 };

// —— 工具：缓动、弹簧、区间、种子随机（不要用 Math.random / Date.now）——
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));                       // t 在 [a,b] 内的进度 0..1
const ease={ outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inOutSine:x=>-(Math.cos(Math.PI*x)-1)/2,
             outBack:x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);} };
const spring=(x,zeta=0.55,w=14)=>x<=0?0:1-Math.exp(-zeta*w*x)*Math.cos(w*Math.sqrt(1-zeta*zeta)*x);
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// 镜头关键帧：[{t, x, y, s}]，段间用 inOutSine；“手持感”用两个低频正弦，停住时归零
function camera(t, keys){ let i=0; while(i<keys.length-2 && t>keys[i+1].t) i++;
  const a=keys[i], b=keys[i+1], p=ease.inOutSine(seg(t,a.t,b.t));
  return { x:lerp(a.x,b.x,p), y:lerp(a.y,b.y,p), s:lerp(a.s,b.s,p) }; }

const $=id=>document.getElementById(id);
window.__seek = function(t){
  // 节拍表：0–0.8 点落下（重音，弹簧）→ 0.8–1.0 停（呼吸）→ 1.0–2.0 点拉出线（延续：同一个物带到下一拍）→ 2.0–3.0 镜头拉远收束
  const cx=W*0.3, cy=H*0.55;
  const drop=spring(seg(t,0,0.8));
  $('dot').style.transform=`translate(${cx-40}px,${lerp(-200,cy-40,drop)}px) scale(${1+0.25*(1-drop)},${1-0.2*(1-drop)})`;
  const grow=ease.outExpo(seg(t,1.0,2.0)), len=W*0.45*grow;
  $('dot').style.left=len+'px';
  Object.assign($('line').style,{left:cx+'px',top:(cy-6)+'px',width:len+'px'});
  Object.assign($('t1').style,{left:(cx-60)+'px',top:(cy-260)+'px',opacity:seg(t,0.35,0.6)*(1-seg(t,1.0,1.3))});
  const k=ease.outBack(seg(t,1.4,1.9));
  Object.assign($('t2').style,{left:(cx+len*0.15)+'px',top:(cy+60)+'px',opacity:seg(t,1.4,1.6),transform:`translateY(${(1-k)*60}px)`});
  const cam=camera(t,[{t:0,x:0,y:0,s:1.15},{t:2.0,x:0,y:0,s:1.15},{t:3.0,x:0,y:0,s:0.9}]);
  const ox=W/2, oy=H/2;
  $('world').style.transform=`translate(${ox}px,${oy}px) scale(${cam.s}) translate(${-ox+cam.x}px,${-oy+cam.y}px)`;
};

// 预览：?play 循环播放，?t=秒 定格
const q=new URLSearchParams(location.search);
if(q.has('t')) window.__seek(parseFloat(q.get('t')));
else if(q.has('play')){ const t0=performance.now(); (function loop(){ window.__seek(((performance.now()-t0)/1000)%window.__meta.duration); requestAnimationFrame(loop); })(); }
else window.__seek(0);
window.__ready = document.fonts ? document.fonts.ready : Promise.resolve();
</script></body></html>
